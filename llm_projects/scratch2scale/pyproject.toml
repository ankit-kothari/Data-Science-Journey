[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "fsdp-qwen3"
version = "0.1.0"
description = "From-scratch FSDP learning project for Qwen-3 4B fine-tuning on 4×A100 GPUs"
authors = ["Ankit Kothari"]
# Prevent Poetry from treating this as a distributable package
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
torch = ">=2.4.0"
torchvision = ">=0.19.0"
transformers = ">=4.44.0"
datasets = ">=3.0.0"
sentencepiece = ">=0.2.0"
bitsandbytes = ">=0.43.0"
numpy = ">=1.26.0"
tqdm = ">=4.66.0"
psutil = ">=5.9.0"

[tool.poetry.group.dev.dependencies]
ipython = "*"
jupyter = "*"
pandas = "*"
matplotlib = "*"
tensorboard = "*"
pytest = "*"